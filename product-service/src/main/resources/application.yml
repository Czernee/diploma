spring:
  application:
    name: product-service
  datasource:
    url: ${PRODUCT_DB_URL:jdbc:postgresql://localhost:5432/diploma_product}
    username: ${PRODUCT_DB_USERNAME:diploma}
    password: ${PRODUCT_DB_PASSWORD:diploma}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    table: flyway_schema_history_product
    baseline-on-migrate: true
    baseline-version: 0
  cache:
    type: redis
  data:
    redis:
      host: ${PRODUCT_REDIS_HOST:localhost}
      port: ${PRODUCT_REDIS_PORT:6379}
      repositories:
        enabled: false

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
