services:
  postgres:
    image: postgres:17
    container_name: diploma-postgres
    environment:
      POSTGRES_DB: diploma
      POSTGRES_USER: diploma
      POSTGRES_PASSWORD: diploma
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-multiple-databases.sh:/docker-entrypoint-initdb.d/10-init-multiple-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diploma -d diploma"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: diploma-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: diploma-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: diploma-ollama
    profiles: ["llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: diploma-auth-service
    environment:
      AUTH_DB_URL: jdbc:postgresql://postgres:5432/diploma_auth
      AUTH_DB_USERNAME: diploma
      AUTH_DB_PASSWORD: diploma
      AUTH_JWT_SECRET: change-me-to-a-long-secret-key-for-hs256-1234567890
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8081"

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: diploma-product-service
    environment:
      PRODUCT_DB_URL: jdbc:postgresql://postgres:5432/diploma_product
      PRODUCT_DB_USERNAME: diploma
      PRODUCT_DB_PASSWORD: diploma
      PRODUCT_REDIS_HOST: redis
      PRODUCT_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8082:8082"

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: diploma-order-service
    environment:
      ORDER_DB_URL: jdbc:postgresql://postgres:5432/diploma_order
      ORDER_DB_USERNAME: diploma
      ORDER_DB_PASSWORD: diploma
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ORDER_KAFKA_ENABLED: "true"
      ORDER_REDIS_HOST: redis
      ORDER_REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8083:8083"

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: diploma-ai-service
    environment:
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b-instruct-q4_0}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-45}
    depends_on:
      product-service:
        condition: service_started
      order-service:
        condition: service_started
    ports:
      - "8000:8000"

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: diploma-api-gateway
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      auth-service:
        condition: service_started
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: diploma-frontend
    depends_on:
      api-gateway:
        condition: service_started
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "5173:80"

volumes:
  postgres_data:
  redis_data:
  ollama_data:
